server {
  listen 80;
  server_name _;

  # Needed by /img: keep the literal // in an encoded avatar URL's scheme
  # (e.g. /img/https://host/...) intact during URI normalization, or nginx
  # collapses it to /img/https:/host/... and the proxy target breaks.
  merge_slashes off;

  root /usr/share/nginx/html;
  index _shell.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Same-origin Supabase proxy: the SPA talks to /rest, /realtime, /auth, /storage
  # on its own origin. SUPABASE_PROXY_PASS is baked at build time via envsubst
  # (see Dockerfile); it must point at the Supabase API host.
  location /rest/ {
    proxy_pass ${SUPABASE_PROXY_PASS}/rest/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /realtime/ {
    proxy_pass ${SUPABASE_PROXY_PASS}/realtime/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /auth/ {
    proxy_pass ${SUPABASE_PROXY_PASS}/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /storage/ {
    proxy_pass ${SUPABASE_PROXY_PASS}/storage/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Same-origin avatar proxy (mirrors the Vite dev middleware): the client
  # requests /img/<scheme>://<host>/<path> (URL percent-encoded, scheme kept
  # literal) and nginx fetches it server-side, so the browser sees same-origin
  # bytes and the dither can read pixels from any avatar URL (no canvas taint).
  # $uri is already percent-decoded, and the literal scheme is preserved by
  # merge_slashes off above. The regex location is the SSRF guard: it only
  # matches http(s) targets; anything else hits the 400 fallback below.
  location ~* ^/img/https?://.+$ {
    resolver 1.1.1.1 valid=300s ipv6=off;
    proxy_ssl_server_name on;
    rewrite ^/img/(.+)$ $1 break;
    proxy_pass $uri;
    proxy_http_version 1.1;
    proxy_cache off;
  }

  location = /img {
    return 400;
  }

  location /img/ {
    return 400;
  }

  location / {
    try_files $uri $uri/ /_shell.html;
  }
}
