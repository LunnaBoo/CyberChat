server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index _shell.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Same-origin Supabase proxy: the SPA talks to /rest, /realtime, /auth, /storage
  # on its own origin. SUPABASE_PROXY_PASS is baked at build time via envsubst
  # (see Dockerfile); it must point at the Supabase API host.
  location /rest/ {
    proxy_pass ${SUPABASE_PROXY_PASS}/rest/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /realtime/ {
    proxy_pass ${SUPABASE_PROXY_PASS}/realtime/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /auth/ {
    proxy_pass ${SUPABASE_PROXY_PASS}/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /storage/ {
    proxy_pass ${SUPABASE_PROXY_PASS}/storage/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /_shell.html;
  }
}
