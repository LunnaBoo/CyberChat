server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index _shell.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /_shell.html;
  }
}
